plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.pz.alipay'
version = '0.1.0'

android {
  namespace "expo.modules.pz.alipay"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Official Alipay App Payment SDK (mavenCentral since 15.8.09).
  implementation 'com.alipay.sdk:alipaysdk-android:15.8.42'
}
