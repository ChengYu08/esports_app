plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.pz.oneclick'
version = '0.1.0'

android {
  namespace "expo.modules.pz.oneclick"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

// 本模块编译需要；:app 解析 runtimeClasspath 时也要能解析同名 AAR。
// 在模块内向根工程注册 flatDir，避免依赖 prebuild 注入 android/build.gradle（CNG 会丢）。
def oneClickLibsDir = file('libs')
repositories {
  flatDir { dirs oneClickLibsDir }
}
rootProject.allprojects { proj ->
  proj.repositories {
    flatDir { dirs oneClickLibsDir }
  }
}

dependencies {
  // AGP 禁止 library 项目直接 fileTree 引用本地 .aar，改用 flatDir 按名引用
  implementation(name: 'auth_number_product-2.14.24-log-online-standard-cuum-release', ext: 'aar')
  implementation(name: 'logger-2.2.2-release', ext: 'aar')
  implementation(name: 'main-2.2.3-release', ext: 'aar')
}
