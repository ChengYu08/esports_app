# =============================================================================
# Drone CI - 盼之电竞 Android APK 构建
# 配套镜像：panzhi/android-build-box（JDK17 / Android SDK 预置，含 node）
#
# 分支规则（自动选择构建环境）：
#   - main / prod，或分支名包含 prod、main  -> 正式包（.env.production）
#   - 分支名包含 test、dev，或其它分支      -> 测试包（.env.development）
#   - 可用自定义事件变量覆盖：DRONE_ENV=prod|test、DRONE_ABI=arm64|universal|all
#
# 注意：仓库为 untrusted，不能挂载 host 卷做缓存（Gradle/npm/NDK 每次构建重新准备）。
# 若管理员在 Drone 仓库设置勾选 Trusted，可参考 android-v3 的 host.path 卷恢复缓存。
# =============================================================================

kind: pipeline
type: docker
name: android-deployment

image_pull_secrets:
  - dockerconfig

steps:
  - name: build-android
    image: nexus.jinliwangluo.com:8082/panzhi/android-build-box:optimized-1.0.1
    pull: if-not-exists
    environment:
      ANDROID_HOME: /opt/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      npm_config_cache: /root/.npm
      # 镜像内已预装 NDK 27.1.12297006（RN 0.86 要求），无需构建时下载
    commands:
      - |
        set -e

        echo "=========================================="
        echo "构建任务配置"
        echo "=========================================="
        echo "分支: $DRONE_BRANCH"
        echo "Node: $(node -v)"
        echo "Java: $(java -version 2>&1 | head -1)"
        echo "ANDROID_HOME: $${ANDROID_HOME}"

        # ---- 按分支名自动选择构建环境 ----
        if [ -n "$${DRONE_ENV}" ]; then
          BUILD_ENV="$${DRONE_ENV}"
          echo "使用手动指定 DRONE_ENV: $${BUILD_ENV}"
        else
          case "$DRONE_BRANCH" in
            *prod*|*main*)
              BUILD_ENV="prod"
              ;;
            *)
              BUILD_ENV="test"
              ;;
          esac
          echo "按分支自动选择构建环境: $${BUILD_ENV}"
        fi

        if [ -n "$${DRONE_ABI}" ]; then
          BUILD_ABI="$${DRONE_ABI}"
        else
          BUILD_ABI="arm64"
        fi
        echo "构建环境: $${BUILD_ENV}  ABI: $${BUILD_ABI}"
        echo "=========================================="

        # 接受 Android SDK 许可（镜像内旧 hash 可能不全）
        mkdir -p "$${ANDROID_HOME}/licenses"
        printf '%s\n' \
          '24333f8a63b6825ea9c5514f83c2829b004d1fee' \
          > "$${ANDROID_HOME}/licenses/android-sdk-license"
        printf '%s\n' \
          '84831b9409646a918e30573bab4c9c91346d8abd' \
          > "$${ANDROID_HOME}/licenses/android-sdk-preview-license"
        if command -v sdkmanager >/dev/null 2>&1; then
          yes | sdkmanager --sdk_root="$${ANDROID_HOME}" --licenses >/dev/null || true
        fi

        # 镜像已预装 NDK 27.1.12297006（见注释），此处仅校验存在，避免 RN 构建中途才报缺 NDK
        NDK_DIR="$${ANDROID_HOME}/ndk/27.1.12297006"
        if [ ! -d "$${NDK_DIR}" ]; then
          echo "镜像缺少 NDK 27.1.12297006，请更新镜像 panzhi/android-build-box:optimized-1.0.1"
          exit 1
        fi
        echo "NDK 就绪: $${NDK_DIR}"

        # 缓存卷跨构建持久化：上次构建若被超时强杀，会遗留守护进程锁文件，
        # 导致本次 Gradle 启动时 "Timeout waiting to lock" 失败，先清理
        pkill -9 -f GradleDaemon 2>/dev/null || true
        pkill -9 -f KotlinCompileDaemon 2>/dev/null || true
        find /root/.gradle -name '*.lock' -delete 2>/dev/null || true

        npm ci --prefer-offline --no-audit --no-fund
        node scripts/build_apk.cjs --env "$${BUILD_ENV}" --abi "$${BUILD_ABI}"

        echo "构建完成，产物:"
        ls -lh ./apks/ 2>/dev/null || echo "未找到 APK"
    when:
      event:
        - push
        - custom
      branch:
        - main
        - prod
        - "*main*"
        - "*prod*"
        - "*test*"
        - "*dev*"

  - name: move-to-dev-server
    image: nexus.jinliwangluo.com:8082/appleboy/drone-scp-with-tools:latest
    pull: if-not-exists
    settings:
      host: dev.jinliwangluo.com
      username: root
      key:
        from_secret: ssh_rsa
      port: 22
      source: ./apks/*.apk
      strip_components: 1
      rm: false
    commands:
      - |
        set -e
        version=$(node -p "require('./app.json').expo.version")
        echo "使用版本: $version"
        target="/home/apps/data/baota/wwwroot/dev.jinliwangluo.com/android/esportsapp/${DRONE_BRANCH}/$version/"
        echo "目标路径: $target"
        /bin/drone-scp --target "$target"
        echo "文件上传成功"
    environment:
      SSH_KEY:
        from_secret: ssh_rsa
    depends_on:
      - build-android
    when:
      event:
        - push
        - custom
      branch:
        - main
        - prod
        - "*main*"
        - "*prod*"
        - "*test*"
        - "*dev*"

trigger:
  event:
    include:
      - push
      - custom
  branch:
    - main
    - prod
    - "*main*"
    - "*prod*"
    - "*test*"
    - "*dev*"
