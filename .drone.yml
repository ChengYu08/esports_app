# =============================================================================
# Drone CI - 盼之电竞 Android APK 构建
# 配套镜像：panzhi/android-build-box（JDK17 / Android SDK 预置，含 node）
#
# 分支规则（自动选择构建环境）：
#   - main / prod，或分支名包含 prod、main  -> 正式包（.env.production）
#   - 分支名包含 test、dev，或其它分支      -> 测试包（.env.development）
#   - 可用自定义事件变量覆盖：DRONE_ENV=prod|test、DRONE_ABI=arm64|universal|all
#
# 缓存：仓库已设为 Trusted，通过 host 卷挂载持久化 Gradle / npm / NDK 缓存，
# 首次构建仍需冷启动写入，之后构建速度大幅提升。
# 注意：并发构建共享同一卷可能冲突（Gradle 自带文件锁基本安全）。
# =============================================================================

kind: pipeline
type: docker
name: android-deployment

# 冷构建（首次写缓存卷）耗时较长，默认 60 分钟会超时被杀
timeout: 180

environment:
  # 当前东八区偏移（分钟），用于把容器内 UTC 时间换算为北京时间
  TZ_OFFSET_MINUTES: 480

image_pull_secrets:
  - dockerconfig

volumes:
  - name: gradle-cache
    host:
      path: /var/lib/drone/cache/esportsapp/gradle
  - name: npm-cache
    host:
      path: /var/lib/drone/cache/esportsapp/npm
  - name: ndk-cache
    host:
      path: /var/lib/drone/cache/esportsapp/android-ndk

steps:
  - name: build-android
    image: nexus.jinliwangluo.com:8082/panzhi/android-build-box:optimized-1.0.0
    pull: if-not-exists
    volumes:
      - name: gradle-cache
        path: /root/.gradle
      - name: npm-cache
        path: /root/.npm
      - name: ndk-cache
        path: /opt/android-sdk/ndk
    environment:
      ANDROID_HOME: /opt/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      npm_config_cache: /root/.npm
      # RN 0.86 默认 NDK（prebuild 生成的 android/ 会要求该版本）
      ANDROID_NDK_VERSION: "27.1.12297006"
    commands:
      - |
        set -e

        echo "=========================================="
        echo "构建任务配置"
        echo "=========================================="
        echo "分支: $DRONE_BRANCH"
        echo "Node: $(node -v)"
        echo "Java: $(java -version 2>&1 | head -1)"
        echo "ANDROID_HOME: $${ANDROID_HOME}"

        # ---- 按分支名自动选择构建环境 ----
        if [ -n "$${DRONE_ENV}" ]; then
          BUILD_ENV="$${DRONE_ENV}"
          echo "使用手动指定 DRONE_ENV: $${BUILD_ENV}"
        else
          case "$DRONE_BRANCH" in
            *prod*|*main*)
              BUILD_ENV="prod"
              ;;
            *)
              BUILD_ENV="test"
              ;;
          esac
          echo "按分支自动选择构建环境: $${BUILD_ENV}"
        fi

        if [ -n "$${DRONE_ABI}" ]; then
          BUILD_ABI="$${DRONE_ABI}"
        else
          BUILD_ABI="arm64"
        fi
        echo "构建环境: $${BUILD_ENV}  ABI: $${BUILD_ABI}"
        echo "=========================================="

        # 接受 Android SDK 许可（镜像内旧 hash 可能不全）
        mkdir -p "$${ANDROID_HOME}/licenses"
        printf '%s\n' \
          '24333f8a63b6825ea9c5514f83c2829b004d1fee' \
          > "$${ANDROID_HOME}/licenses/android-sdk-license"
        printf '%s\n' \
          '84831b9409646a918e30573bab4c9c91346d8abd' \
          > "$${ANDROID_HOME}/licenses/android-sdk-preview-license"
        if command -v sdkmanager >/dev/null 2>&1; then
          yes | sdkmanager --sdk_root="$${ANDROID_HOME}" --licenses >/dev/null || true
        fi

        # NDK 持久化在 host 卷 /opt/android-sdk/ndk，仅首次构建需要下载安装
        NDK_DIR="$${ANDROID_HOME}/ndk/$${ANDROID_NDK_VERSION}"
        if [ ! -d "$${NDK_DIR}" ]; then
          echo "安装 NDK $${ANDROID_NDK_VERSION}（首次会下载，之后走缓存）..."
          sdkmanager --sdk_root="$${ANDROID_HOME}" "ndk;$${ANDROID_NDK_VERSION}"
        else
          echo "已命中 NDK 缓存: $${NDK_DIR}"
        fi

        # 缓存卷跨构建持久化：上次构建若被超时强杀，会遗留守护进程锁文件，
        # 导致本次 Gradle 启动时 "Timeout waiting to lock" 失败，先清理
        pkill -9 -f GradleDaemon 2>/dev/null || true
        pkill -9 -f KotlinCompileDaemon 2>/dev/null || true
        find /root/.gradle -name '*.lock' -delete 2>/dev/null || true

        npm ci --prefer-offline --no-audit --no-fund

        # 冷构建可能远超 60 分钟（NDK + 全量 Gradle 依赖），放宽 pipeline 超时后再跑
        node scripts/build_apk.cjs --env "$${BUILD_ENV}" --abi "$${BUILD_ABI}"

        echo "构建完成，产物:"
        ls -lh ./apks/ 2>/dev/null || echo "未找到 APK"

        # ---- 生成构建元数据（供最终信息展示步骤读取） ----
        version=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' ./app.json | head -1 | tr -d '[:space:]')
        # 兜底：从 APK 文件名解析版本号（格式：盼之电竞-<version>-<abi>-<env>-<ts>.apk）
        if [ -z "$version" ]; then
          for apk_path in ./apks/*.apk; do
            [ -f "$apk_path" ] || continue
            fname=$(basename "$apk_path" .apk)
            version=$(echo "$fname" | sed -E 's/^[^-]+-([0-9]+\.[0-9]+\.[0-9]+)-.*/\1/')
            [ -n "$version" ] && break
          done
        fi
        echo "解析到版本号: [$version]"
        {
          echo "BUILD_ENV=$${BUILD_ENV}"
          echo "BUILD_ABI=$${BUILD_ABI}"
          echo "APP_VERSION=$${version}"
          echo "BUILD_STARTED_AT=$${DRONE_BUILD_STARTED}"
        } > ./drone-build-info.env

        # 构建的 UTC 与本地时间（构建容器默认 UTC；展示步骤会用东八区偏移换算为北京时间）
        {
          printf 'BUILD_TIME_UTC=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          printf 'DRONE_COMMIT_SHORT=%s\n' "$(echo "$DRONE_COMMIT_SHA" | cut -c1-8)"
          printf 'DRONE_BUILD_START_TS=%s\n' "$DRONE_BUILD_STARTED"
          printf 'DRONE_BUILD_FINISH_TS=%s\n' "$(date +%s)"
        } >> ./drone-build-info.env

        echo "构建元数据已生成: ./drone-build-info.env"
    when:
      event:
        - push
        - custom
      branch:
        - main
        - prod
        - "*main*"
        - "*prod*"
        - "*test*"
        - "*dev*"

  - name: move-to-dev-server
    image: nexus.jinliwangluo.com:8082/appleboy/drone-scp-with-tools:latest
    pull: if-not-exists
    settings:
      host: dev.jinliwangluo.com
      username: root
      key:
        from_secret: ssh_rsa
      port: 22
      source: ./apks/*.apk
      strip_components: 1
      rm: false
    commands:
      - |
        set -e
        # 该镜像无 node，用 sed 从 app.json 提取 expo.version
        version=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' ./app.json | head -1)
        if [ -z "$version" ]; then echo "无法从 app.json 解析 version"; exit 1; fi
        echo "使用版本: $version"
        target="/home/apps/data/baota/wwwroot/dev.jinliwangluo.com/android/esportsapp/${DRONE_BRANCH}/$version/"
        echo "目标路径: $target"
        /bin/drone-scp --target "$target"
        echo "文件上传成功"
    environment:
      SSH_KEY:
        from_secret: ssh_rsa
    depends_on:
      - build-android
    when:
      event:
        - push
        - custom
      branch:
        - main
        - prod
        - "*main*"
        - "*prod*"
        - "*test*"
        - "*dev*"

  - name: print-build-info
    image: alpine:3.19
    pull: if-not-exists
    commands:
      - |
        set -e

        echo " "
        echo "╔════════════════════════════════════════════════════════════════╗"
        echo "║              盼之电竞 Android APK 构建信息汇总                  ║"
        echo "╚════════════════════════════════════════════════════════════════╝"

        # 读取构建元数据
        if [ -f ./drone-build-info.env ]; then
          . ./drone-build-info.env
        fi

        # ---- Git 提交信息 ----
        echo " "
        echo "📌 Git 提交信息"
        echo "------------------------------------------------"
        printf "  分支        : %s\n" "$DRONE_BRANCH"
        printf "  Commit      : %s\n" "$DRONE_COMMIT_SHA"
        printf "  Commit 短   : %s\n" "$DRONE_COMMIT_SHORT"
        printf "  提交作者    : %s <%s>\n" "$DRONE_COMMIT_AUTHOR" "$DRONE_COMMIT_AUTHOR_EMAIL"
        printf "  提交信息    : %s\n" "$DRONE_COMMIT_MESSAGE"
        printf "  提交链接    : %s\n" "$DRONE_COMMIT_LINK"
        printf "  构建编号    : #%s\n" "$DRONE_BUILD_NUMBER"
        printf "  构建链接    : %s\n" "$DRONE_BUILD_LINK"

        # ---- 构建环境信息 ----
        echo " "
        echo "🏷️  构建环境"
        echo "------------------------------------------------"
        printf "  构建环境    : %s\n" "$BUILD_ENV"
        printf "  CPU 架构    : %s\n" "$BUILD_ABI"
        printf "  应用版本号  : %s\n" "$APP_VERSION"

        # ---- 时间信息（本地时间 / 北京时间）----
        echo " "
        echo "🕐 构建时间"
        echo "------------------------------------------------"
        printf "  UTC 时间    : %s\n" "$BUILD_TIME_UTC"

        # 通过 TZ_OFFSET_MINUTES 计算北京时间（容器默认 UTC）
        if [ -n "$DRONE_BUILD_START_TS" ] && [ -n "$TZ_OFFSET_MINUTES" ]; then
          offset_sec=$(( TZ_OFFSET_MINUTES * 60 ))
          bj_start=$(( DRONE_BUILD_START_TS + offset_sec ))
          bj_finish=$(( DRONE_BUILD_FINISH_TS + offset_sec ))
          if command -v date >/dev/null 2>&1 && date -d "@$bj_start" >/dev/null 2>&1; then
            printf "  北京时间开始: %s\n" "$(date -d "@$bj_start" '+%Y-%m-%d %H:%M:%S')"
            printf "  北京时间结束: %s\n" "$(date -d "@$bj_finish" '+%Y-%m-%d %H:%M:%S')"
          else
            printf "  东八区开始  : Unix %s (+%s 分钟)\n" "$bj_start" "$TZ_OFFSET_MINUTES"
            printf "  东八区结束  : Unix %s (+%s 分钟)\n" "$bj_finish" "$TZ_OFFSET_MINUTES"
          fi
          # 构建耗时
          duration=$(( DRONE_BUILD_FINISH_TS - DRONE_BUILD_START_TS ))
          printf "  构建耗时    : %s 秒 (约 %s 分钟)\n" "$duration" "$(( duration / 60 ))"
        fi

        # ---- APK 下载地址 ----
        echo " "
        echo "📦 下载地址"
        echo "------------------------------------------------"
        # 兜底：若元数据里版本号为空，从 APK 文件名解析
        if [ -z "$APP_VERSION" ]; then
          for apk_path in ./apks/*.apk; do
            [ -f "$apk_path" ] || continue
            fname=$(basename "$apk_path" .apk)
            APP_VERSION=$(echo "$fname" | sed -E 's/^[^-]+-([0-9]+\.[0-9]+\.[0-9]+)-.*/\1/')
            [ -n "$APP_VERSION" ] && break
          done
        fi
        apks_found=0
        for apk_path in ./apks/*.apk; do
          [ -f "$apk_path" ] || continue
          apks_found=$((apks_found + 1))
          filename=$(basename "$apk_path")
          size=$(ls -lh "$apk_path" | awk '{print $5}')
          # URL 编码中文文件名（避免部分浏览器/工具识别失败）
          encoded=$(printf '%s' "$filename" | od -An -v -tx1 | awk '{for(i=1;i<=NF;i++)printf "%%%s",$i}' | tr -d '\n')
          url="http://dev.jinliwangluo.com/android/esportsapp/$DRONE_BRANCH/$APP_VERSION/$encoded"
          printf "  文件名      : %s\n" "$filename"
          printf "  大小        : %s\n" "$size"
          printf "  下载地址    : %s\n" "$url"
          echo "  ------------------------------------------------"
        done
        if [ "$apks_found" -eq 0 ]; then
          echo "  ⚠️  未找到 APK 文件"
        fi
        echo " "
    when:
      event:
        - push
        - custom
      branch:
        - main
        - prod
        - "*main*"
        - "*prod*"
        - "*test*"
        - "*dev*"
    depends_on:
      - move-to-dev-server

trigger:
  event:
    include:
      - push
      - custom
  branch:
    - main
    - prod
    - "*main*"
    - "*prod*"
    - "*test*"
    - "*dev*"
