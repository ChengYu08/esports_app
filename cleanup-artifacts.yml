name: Cleanup Actions Artifacts

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DELETE to remove every Actions artifact in this repository'
        required: true
        type: string

permissions:
  actions: write

jobs:
  cleanup:
    name: Delete all artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Delete all repository artifacts
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            if (context.payload.inputs.confirmation !== 'DELETE') {
              core.setFailed('Confirmation did not match DELETE; no artifacts were removed.');
              return;
            }

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
            );

            core.info(`Found ${artifacts.length} artifact(s).`);

            for (const artifact of artifacts) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              core.info(`Deleted ${artifact.name} (id: ${artifact.id}).`);
            }

            core.info('Artifact cleanup completed.');
